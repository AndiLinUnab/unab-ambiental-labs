# Datasource InfluxDB (Flux) provisionado automáticamente.
# Grafana sustituye ${INFLUX_*} con las variables de entorno del contenedor
# (definidas en docker-compose.yml a partir del archivo .env).
apiVersion: 1

datasources:
  - name: InfluxDB-Ambiental
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
