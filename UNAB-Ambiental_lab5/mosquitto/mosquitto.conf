# Mosquitto 2.x — broker interno de la plataforma UNAB-Ambiental
#
# El puerto 1883 NO se publica fuera de la red de Docker (ver docker-compose.yml),
# por eso se permite acceso anónimo: solo el publicador y Telegraf pueden llegar a él.
# Si algún día se expone el broker fuera de la VM, hay que activar autenticación
# (password_file) y TLS antes de abrir el puerto.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous true
