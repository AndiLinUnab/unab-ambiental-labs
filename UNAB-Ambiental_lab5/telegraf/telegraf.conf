# Telegraf — puente MQTT -> InfluxDB 2 (UNAB-Ambiental, Laboratorio 5)
#
# Los valores ${INFLUX_TOKEN}, ${INFLUX_ORG} e ${INFLUX_BUCKET} los inyecta
# docker-compose.yml desde el archivo .env (no hay secretos en este archivo).

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  flush_interval = "10s"
  omit_hostname = true

# ---- Entrada: suscripción MQTT -------------------------------------------------
# Topic de telemetría:  unab/ambiental/<sala>/telemetria
# Payload JSON:         {"temperature": 24.1, "humidity": 52.3, "illuminance": 430.2, "ts": 1760000000000}
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/ambiental/+/telemetria"]
  qos = 1
  # Con QoS 1 y sesión persistente, el broker retiene los mensajes si Telegraf se reinicia.
  persistent_session = true
  client_id = "telegraf-ambiental"
  connection_timeout = "30s"

  data_format = "json_v2"

  # El tercer segmento del topic (la sala) queda como tag "sala".
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "unab/ambiental/+/telemetria"
    tags = "_/_/sala/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "ambiental"
    # Marca de tiempo REAL del dato: la genera el publicador (milisegundos Unix).
    # Si prefieres usar la hora de recepción en Telegraf, comenta estas dos líneas.
    timestamp_path = "ts"
    timestamp_format = "unix_ms"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humidity"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "illuminance"
      type = "float"

# ---- Salida: InfluxDB 2 ----------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
