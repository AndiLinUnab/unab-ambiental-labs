apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-db-data
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-mariadb
  namespace: wordpress
  labels:
    app: wp-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wp-mariadb
  template:
    metadata:
      labels:
        app: wp-mariadb
        portal: wordpress
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: wp-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wp-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: wp-mariadb
  namespace: wordpress
spec:
  type: ClusterIP
  selector:
    app: wp-mariadb
  ports:
    - port: 3306
      targetPort: 3306
